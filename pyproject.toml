[project]
name = "ragoa"
version = "0.1.0"
description = "Voice-enabled RAG over MSMARCO-XI with sub-200ms retrieval, a harness, and guardrails"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "openai>=1.40",
    "pyarrow>=17",
    "numpy>=1.26",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "hnswlib>=0.8",
    "orjson>=3.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Serving runtime. The deploy target has no GPU, and the torch cross-encoder
# does not fit the 200ms budget on CPU, so quantised ONNX is required rather
# than a nice-to-have. Kept separate from the build-time torch path.
serve = [
    "onnxruntime>=1.20",
    "transformers>=4.29",
]
build = [
    "sentence-transformers>=3.0",
    "optimum[onnxruntime]>=1.24",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragoa"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab cells are not modules: they use shell magics, #@param annotations, and
# import after installing. Linting them as Python reports style violations that
# would be wrong to "fix".
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# File()/Form() in argument defaults is how FastAPI declares uploads and form
# fields; B008 is a false positive there.
"apps/api/main.py" = ["B008"]
